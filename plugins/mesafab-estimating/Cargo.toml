# Mesa Fab's own estimating checks, as a Hyperview plugin.
#
# Built on its own, for WebAssembly, and never part of the program: it goes
# to Mesa Fab's office server as a signed .hvplugin and from there to Mesa
# Fab's seats, and nobody else's copy of Hyperview ever has it.
#
#   ./build.sh            -> target/mesafab_estimating.wasm
#   publish.py sign-plugin (on the publisher's PC) -> .hvplugin

[package]
name = "mesafab-estimating"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
plugin-api = { path = "../../crates/plugin-api", features = ["guest"] }
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
