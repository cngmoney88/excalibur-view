[package]
name = "hyperview-release"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Signing and checking Hyperview releases. The key stays with whoever runs this."

[[bin]]
name = "hyperview-release"
path = "src/main.rs"

[dependencies]
hub = { path = "../hub", default-features = false }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
