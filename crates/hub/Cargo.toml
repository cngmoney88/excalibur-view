[package]
name = "hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The Hyperview wire model and client: what a desktop, a server and anybody else's integration all agree on."

[dependencies]
annot = { path = "../annot" }
pdf = { path = "../pdf" }
takeoff = { path = "../takeoff" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
ed25519-dalek = "2"
plugin-api = { path = "../plugin-api" }
ureq = { version = "2", features = ["json", "tls"], optional = true }
# The certificates a connection trusts: the ones built in and the ones Windows
# trusts, both. See `web.rs`.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }
webpki-roots = { version = "0.26", optional = true }
rustls-native-certs = { version = "0.7", optional = true }

[features]
default = ["client"]
# The HTTP client. A server depends on this crate for the types alone and can
# leave the client out.
client = ["dep:ureq", "dep:rustls", "dep:webpki-roots", "dep:rustls-native-certs"]

# Machine policy: the one registry value an administrator sets through Group
# Policy to seal a computer. Read-only, HKLM\Software\Policies.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Registry", "Win32_Foundation"] }
